<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAW Scene Portrait</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;900&family=DM+Serif+Display:ital@0;1&display=swap");

      /*
        Themes:
          bw-dark    — B&W photo, dark overlay, white text   (Example 4)
          color      — Full colour photo, dark gradient       (Example 5)
          duotone    — Gold/amber duotone tint, white text
          grain      — Heavy grain, washed editorial
      */

      :root {
        --fg: #f0f0f0;
        --fg-muted: rgba(240,240,240,0.65);
        --accent: #d4a520;
        --badge-bg: transparent;
        --badge-border: rgba(240,240,240,0.70);
        --overlay-top: rgba(8,8,8,0.55);
        --overlay-mid: rgba(8,8,8,0.20);
        --overlay-bot: rgba(8,8,8,0.92);
        --photo-filter: grayscale(1) contrast(1.12) brightness(0.88);
        --grain-opacity: 0.38;
        --grain-blend: soft-light;
      }
      body[data-theme="color"] {
        --photo-filter: none;
        --overlay-top: rgba(8,8,8,0.38);
        --overlay-bot: rgba(8,8,8,0.88);
        --grain-opacity: 0.24;
      }
      body[data-theme="duotone"] {
        --photo-filter: grayscale(1) sepia(0.9) saturate(1.6) hue-rotate(5deg) brightness(0.78);
        --overlay-top: rgba(20,12,0,0.50);
        --overlay-bot: rgba(20,12,0,0.90);
        --grain-opacity: 0.30;
      }
      body[data-theme="grain"] {
        --photo-filter: grayscale(1) contrast(1.30) brightness(0.70);
        --overlay-top: rgba(4,4,4,0.40);
        --overlay-bot: rgba(4,4,4,0.95);
        --grain-opacity: 0.65;
        --grain-blend: overlay;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1350px;
        overflow: hidden; position: relative;
        background: #050505;
        color: var(--fg);
        font-family: "Inter", sans-serif;
      }

      /* ─── FULL-FRAME PHOTO ─── */
      .photo-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center 30%;
        filter: var(--photo-filter);
        z-index: 0;
      }

      /* ─── GRADIENT OVERLAYS ─── */
      .overlay-top {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          var(--overlay-top) 0%,
          var(--overlay-mid) 35%,
          transparent 60%
        );
        z-index: 2;
        pointer-events: none;
      }
      .overlay-bottom {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 520px;
        background: linear-gradient(
          to top,
          var(--overlay-bot) 0%,
          var(--overlay-bot) 40%,
          transparent 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* ─── GRAIN ─── */
      .grain {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        mix-blend-mode: var(--grain-blend);
        opacity: var(--grain-opacity);
      }

      /* ─── VERTICAL URL STRIP (right edge) ─── */
      .url-strip {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        transform-origin: center center;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.14em;
        color: rgba(240,240,240,0.42);
        white-space: nowrap;
        z-index: 20;
        pointer-events: none;
      }

      /* ─── TOP CONTENT ─── */
      .top-row {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 52px 60px 0 60px;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo { width: 42px; height: 42px; object-fit: contain; }
      .wordmark {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg);
      }
      .badge {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg);
        border: 1.5px solid var(--badge-border);
        padding: 7px 16px;
      }

      /* ─── BOTTOM CONTENT ─── */
      .bottom-content {
        position: absolute;
        bottom: 0; left: 0; right: 60px;
        padding: 0 60px 58px 60px;
        z-index: 20;
      }
      .label {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .headline {
        font-family: "Bebas Neue", sans-serif;
        font-size: 158px;
        line-height: 0.88;
        letter-spacing: 0.01em;
        color: var(--fg);
        margin-bottom: 20px;
      }
      .body-text {
        font-family: "DM Serif Display", serif;
        font-style: italic;
        font-size: 30px;
        line-height: 1.38;
        color: var(--fg-muted);
        max-width: 640px;
        margin-bottom: 32px;
      }
      .bottom-row {
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .cta-btn {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg);
        border: 2px solid rgba(240,240,240,0.50);
        padding: 12px 24px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body data-theme="bw-dark">

    <div class="photo-bg" id="photo-bg"></div>
    <div class="overlay-top" aria-hidden="true"></div>
    <div class="overlay-bottom" aria-hidden="true"></div>

    <div class="grain" aria-hidden="true">
      <svg width="1080" height="1350" xmlns="http://www.w3.org/2000/svg">
        <filter id="g1"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/></filter>
        <filter id="g2"><feTurbulence type="fractalNoise" baseFrequency="0.28" numOctaves="2" stitchTiles="stitch"/></filter>
        <rect width="1080" height="1350" filter="url(#g1)" opacity="0.65"/>
        <rect width="1080" height="1350" filter="url(#g2)" opacity="0.25"/>
      </svg>
    </div>

    <div class="url-strip" id="url-strip">rawactorstudio.com/book</div>

    <div class="top-row">
      <div class="brand">
        <img class="logo" id="logo" src="" alt="RAW" />
        <div class="wordmark">RAW Actor Studio</div>
      </div>
      <div class="badge" id="badge">ENROLLMENT OPEN</div>
    </div>

    <div class="bottom-content">
      <div class="label" id="label">THE MASTER CLASS</div>
      <div class="headline" id="headline">Build A Repeatable Process</div>
      <div class="body-text" id="body-text">Turn preparation into a repeatable process.</div>
      <div class="bottom-row">
        <div class="cta-btn" id="cta-btn">TRAIN WITH CLARITY</div>
      </div>
    </div>

    <!-- RAW_PAYLOAD -->
    <script>
      const post = window.__RAW_POST__ || {};
      const assets = window.__RAW_ASSETS__ || {};

      if (assets.theme) document.body.dataset.theme = assets.theme;

      const logoEl = document.getElementById("logo");
      if (logoEl && assets.logoSrc) logoEl.src = assets.logoSrc;

      const photoSrc = assets.photoBgSrc || assets.photoUrl || post.photo_url || "";
      if (photoSrc) {
        document.getElementById("photo-bg").style.backgroundImage =
          `url("${photoSrc}")`;
      }

      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set("label", post.label || "THE MASTER CLASS");
      set("headline", post.headline || "Build A Repeatable Process");
      set("body-text", post.image_body || "Turn preparation into a repeatable process.");
      set("badge", post.cta_type === "audit" ? "FREE AUDIT" : "ENROLLMENT OPEN");
      set("cta-btn", post.cta_type === "audit" ? "BOOK A FREE AUDIT"
        : post.offer_id === "raw-reels" ? "EMAIL RAW REELS"
        : "TRAIN WITH CLARITY");
      set("url-strip", post.cta_url
        ? post.cta_url.replace(/^https?:\/\//, "")
        : "rawactorstudio.com/book");

      // Scale headline if needed
      const hl = document.getElementById("headline");
      if (hl) {
        let size = 158;
        while (hl.scrollHeight > 360 && size > 72) {
          size -= 6;
          hl.style.fontSize = size + "px";
        }
      }
    </script>
  </body>
</html>
