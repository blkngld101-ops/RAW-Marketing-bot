<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAW Behind The Scenes</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap");

      :root {
        --bg: #090909;
        --fg: #f0f0f0;
        --muted: rgba(240, 240, 240, 0.7);
        --accent: #c4a35a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background:
          linear-gradient(160deg, rgba(196, 163, 90, 0.14), transparent 34%),
          linear-gradient(140deg, #090909 0%, #141414 100%);
        color: var(--fg);
      }

      body {
        position: relative;
        font-family: "Inter", sans-serif;
      }

      .photo {
        position: absolute;
        right: 72px;
        top: 124px;
        width: 400px;
        height: 540px;
        border-radius: 34px;
        border: 1px solid rgba(240, 240, 240, 0.1);
        overflow: hidden;
        opacity: 0;
        background:
          linear-gradient(180deg, rgba(10, 10, 10, 0.18), rgba(10, 10, 10, 0.76)),
          linear-gradient(135deg, rgba(196, 163, 90, 0.24), rgba(255, 255, 255, 0.08));
        background-size: cover;
        background-position: center;
      }

      body[data-layout="photo-led"] .photo {
        opacity: 1;
      }

      .frame {
        position: relative;
        height: 100%;
        padding: 72px;
      }

      .wordmark {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .label {
        margin-top: 74px;
        color: var(--accent);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .headline {
        max-width: 640px;
        margin: 22px 0 18px;
        font-family: "Bebas Neue", sans-serif;
        font-size: 92px;
        line-height: 0.92;
      }

      body[data-layout="photo-led"] .headline {
        max-width: 520px;
      }

      .body {
        max-width: 560px;
        font-size: 27px;
        line-height: 1.42;
        font-weight: 300;
        color: var(--muted);
      }

      .note {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 112px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        color: rgba(240, 240, 240, 0.56);
        font-size: 16px;
      }

      .bar {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 72px;
        height: 4px;
        background: var(--accent);
      }
    </style>
  </head>
  <body data-layout="text-led">
    <div class="photo" id="photo"></div>
    <div class="frame">
      <div class="wordmark">RAW ACTOR STUDIO</div>
      <div class="label" id="label">IN THE ROOM</div>
      <div class="headline" id="headline">Show the standards, not just the promise.</div>
      <div class="body" id="body">The room is part of the offer. The pressure, the notes, the level of specificity, and the support all matter.</div>
      <div class="note">
        <div id="note-left"></div>
        <div id="note-right"></div>
      </div>
      <div class="bar"></div>
    </div>
    <!-- RAW_PAYLOAD -->
    <script>
      const post = window.__RAW_POST__ || {};
      const setText = (id, value, fallback = "") => {
        const node = document.getElementById(id);
        if (node) {
          node.textContent = value || fallback;
        }
      };

      document.body.dataset.layout =
        post.layout_variant === "photo-led" ? "photo-led" : "text-led";

      setText("label", post.label || "IN THE ROOM");
      setText("headline", post.headline, "RAW class moment");
      setText("body", post.image_body, "Specific work. Serious support. Useful notes.");
      setText("note-left", post.visual_direction || "");
      setText("note-right", post.cta_type ? `CTA: ${post.cta_type}` : "");

      const photo = document.getElementById("photo");
      const imageUrl = post.media?.image_url || post.photo_url || "";
      if (imageUrl) {
        photo.style.backgroundImage = `linear-gradient(180deg, rgba(10, 10, 10, 0.18), rgba(10, 10, 10, 0.76)), url("${imageUrl}")`;
      }
    </script>
  </body>
</html>
